<!doctype html>
<!--
  The Chrome Web Store's small promo tile, 440×280. tools/store/capture.ts
  renders it to store/promo-small.png. The store shows it at half size too, so
  the text stays large and short.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>INP Radar promo tile</title>
    <style>
      @font-face {
        font-family: 'Geist Variable';
        font-weight: 100 900;
        src: url('../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2')
          format('woff2-variations');
      }

      body {
        margin: 0;
        width: 440px;
        height: 280px;
        display: flex;
        align-items: center;
        gap: 28px;
        padding: 0 36px;
        box-sizing: border-box;
        /* Bench Ink, with the Paper and Muted Slate text from DESIGN.md. */
        background: #121926;
        color: #fcfcfd;
        font-family: 'Geist Variable', sans-serif;
      }

      img {
        width: 132px;
        height: 132px;
        flex: none;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 40px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0;
        color: #cdd5df;
        font-size: 19px;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <img src="../../design/logo/mark.svg" alt="" />
    <div>
      <h1>INP Radar</h1>
      <p>See when the main thread is blocked, live.</p>
    </div>
  </body>
</html>
