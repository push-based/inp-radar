<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INP Radar</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="status" id="status" data-state="connecting">
      <span class="status-dot"></span>
      <span class="status-text" id="status-text">Connecting…</span>
      <button id="reload" type="button" hidden>Reload page</button>
    </header>

    <main>
      <section class="feature">
        <div class="feature-box metric" id="inp-box">
          <label class="metric-title">
            INP
            <em>(since page load)</em>
          </label>
          <span class="metric-value"
            ><span id="inp-value">–</span><small>ms</small></span
          >
          <div class="breakdown" id="breakdown" hidden>
            <div class="breakdown-bar">
              <span class="input-delay" id="bar-input-delay"></span>
              <span class="processing" id="bar-processing"></span>
              <span class="presentation" id="bar-presentation"></span>
            </div>
            <dl>
              <dt class="input-delay">Input delay</dt>
              <dd id="inp-input-delay"></dd>
              <dt class="processing">Processing</dt>
              <dd id="inp-processing"></dd>
              <dt class="presentation">Presentation</dt>
              <dd id="inp-presentation"></dd>
            </dl>
            <code class="target" id="inp-target"></code>
          </div>
        </div>

        <div class="feature-box frame-meter">
          <div id="clock" class="clock">
            <div class="clock-hand"></div>
          </div>
          <span class="frame-meter-label" id="clock-label">Main thread</span>
        </div>

        <div class="feature-box pulse-box">
          <div class="pulse-screen">
            <canvas id="pulse"></canvas>
          </div>
          <div class="pulse-label">
            <span>Heartbeat <em>(time since last frame)</em></span>
            <span id="pulse-readout"></span>
          </div>
        </div>
      </section>

      <section class="log">
        <h2>Event log <em>(newest first, ≥ 16 ms)</em></h2>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Event</th>
                <th class="value">Duration</th>
                <th class="value">Time</th>
              </tr>
            </thead>
            <tbody id="event-log"></tbody>
          </table>
          <p class="empty">Interact with the page to see events.</p>
        </div>
      </section>
    </main>

    <footer class="credit">

        href="https://push-based.io/?utm_source=inp-radar&amp;utm_medium=referral&amp;utm_campaign=open-source-tools&amp;utm_content=sidepanel-footer"
        target="_blank"
        rel="noopener"
        aria-label="Made with love by PushBased"
      >
        Made with <span class="credit-heart" aria-hidden="true">♥</span> by
        <svg
          class="credit-logo"
          width="9"
          height="12"
          viewBox="0 0 173.5 242.3"
          aria-hidden="true"
          focusable="false"
        >
          <path
            class="credit-logo-base"
            d="m 61.4,226 c 2.5,-12 1.6,-24.6 3.6,-36.6 1.6,-9.4 4.6,-18.9 10.8,-26.4 5.8,-7 15.6,-14.4 22.6,-19.8 15.8,-12.1 33.7,-23.1 45.7,-39.4 0.1,-0.3 0.4,-0.5 0.5,-0.8 2.5,-3.7 5.4,-7.3 7.5,-11.2 C 156.7,83 159,73 159,63.1 159,23.4 129.2,0 89,0 H 28 C 12.6,0 0,12.5 0,28 v 186 c 0,15.5 12.5,28 28,28 h 17.8 c 9.4,-0.1 13.9,-7.8 15.6,-16 z"
          />
          <path

            d="m 173.5,185.1 c 0,18.6 -7.4,33.4 -19.7,43.7 -0.5,0.4 -1.1,0.9 -1.6,1.3 -10.4,7.9 -23.4,12 -36.6,12 h -47 c 4,-2.8 6.2,-7.5 7.3,-12.5 2.5,-11.4 1.6,-23.1 3.6,-34.5 1.6,-8.8 4.6,-17.8 10.8,-25 5.8,-6.6 15.6,-13.6 22.6,-18.6 1.7,-1.2 3.3,-2.4 5,-3.6 8.1,-5.7 16.5,-11.2 24.2,-17.4 6.1,4.9 11.8,10.2 16.5,16.2 0.1,0.3 0.4,0.5 0.5,0.8 2.5,3.4 5.4,6.9 7.5,10.6 4.6,8.3 6.9,17.6 6.9,27 z"

  </body>
</html>
